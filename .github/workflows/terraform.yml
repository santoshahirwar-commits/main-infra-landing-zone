name: Terraform CI

on:
  push:
    branches:
      - main
      - feature/*
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  preprod:
    name: Terraform Preprod Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",

              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: ./environments/preprod
        run: terraform init

      - name: Terraform Validate
        working-directory: ./environments/preprod
        run: terraform validate

      - name: Terraform Plan
        working-directory: ./environments/preprod
        run: terraform plan -out=plan.tfplan

      - name: Show Plan
        working-directory: ./environments/preprod
        run: terraform show -no-color plan.tfplan

  prod:
    name: Terraform Prod Validation
    runs-on: ubuntu-latest
    needs: preprod
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: Terraform Init
        working-directory: ./environments/prod
        run: terraform init

      - name: Terraform Validate
        working-directory: ./environments/prod
        run: terraform validate

      - name: Terraform Plan
        working-directory: ./environments/prod
        run: terraform plan -out=plan.tfplan

      - name: Show Plan
        working-directory: ./environments/prod
        run: terraform show -no-color plan.tfplan
